<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site previews</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#16181d; color:#e8eaee;
       font-family: system-ui, sans-serif; }
main { padding:2rem; max-width:34rem; }
h1 { font-size:1.3rem; font-weight:600; margin:0 0 1.5rem; color:#9aa3b2; }
a.site { display:block; text-decoration:none; color:inherit; border:1px solid #2a2e37; border-radius:14px;
         padding:1.2rem 1.4rem; margin-bottom:1rem; transition:border-color .15s; }
a.site:hover { border-color:#6b7484; }
a.site strong { display:block; font-size:1.15rem; margin-bottom:0.2rem; }
a.site span { color:#9aa3b2; font-size:0.92rem; }
</style>
</head>
<body>
<main>
  <h1>Site previews</h1>
  <a class="site" href="liffey-accountancy/">
    <strong>Liffey Accountancy</strong>
    <span>Multi-page local practice site — navy, classic, light</span>
  </a>
  <a class="site" href="alder-and-frost/">
    <strong>Alder &amp; Frost</strong>
    <span>Single-page fictional boutique — premium dark mode, emerald</span>
  </a>
</main>
</body>
</html>
