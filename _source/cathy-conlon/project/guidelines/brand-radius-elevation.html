<!-- @dsCard group="Brand" viewport="700x190" subtitle="Barely-rounded paper; hairlines before shadows" name="Radius & elevation" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Radius & elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div class="row" style="align-items:flex-start">
   <div class="sw"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);background:var(--bg-raised)"></div><div class="nm">xs 2</div><div class="lbl">badges, checkbox</div></div><div class="sw"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg-raised)"></div><div class="nm">sm 4</div><div class="lbl">buttons, inputs</div></div><div class="sw"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--bg-raised)"></div><div class="nm">md 8</div><div class="lbl">alerts, menus</div></div><div class="sw"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-lg);background:var(--bg-raised)"></div><div class="nm">lg 12</div><div class="lbl">dialogs, newsletter</div></div><div class="sw"><div style="height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-full);background:var(--bg-raised)"></div><div class="nm">full</div><div class="lbl">tags, switch, search</div></div></div>
   <div class="row" style="margin-top:16px;align-items:flex-start">
   <div class="sw"><div style="height:44px;border-radius:8px;background:var(--bg-raised);border:1px solid var(--border)"></div><div class="nm">hairline</div><div class="lbl">cards, rows, sections</div></div><div class="sw"><div style="height:44px;border-radius:8px;background:var(--bg-raised);box-shadow:var(--shadow-1)"></div><div class="nm">shadow-1</div><div class="lbl">book covers at rest</div></div><div class="sw"><div style="height:44px;border-radius:8px;background:var(--bg-raised);box-shadow:var(--shadow-2)"></div><div class="nm">shadow-2</div><div class="lbl">menus, hover lift</div></div><div class="sw"><div style="height:44px;border-radius:8px;background:var(--bg-raised);box-shadow:var(--shadow-3)"></div><div class="nm">shadow-3</div><div class="lbl">dialogs, drawers, toasts</div></div></div></body></html>
