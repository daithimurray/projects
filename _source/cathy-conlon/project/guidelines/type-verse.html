<!-- @dsCard group="Type" viewport="700x300" subtitle="Hanging indent on wrapped lines; stanza gap 1.6em; never justified" name="Verse setting" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Verse setting</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><article class="ih-poem"><h1 class="ih-poem__title">Specimen</h1><p class="ih-poem__meta">setting only, not the author's text</p>
  <p class="ih-poem__stanza"><span class="ih-poem__line">Set each line as the poet set it,</span><span class="ih-poem__line ih-poem__line--indent">let the long ones hang,</span><span class="ih-poem__line">and give the stanza room before the next one begins; a wrapped line indents so it never reads as a new one.</span></p>
  <p class="ih-poem__stanza"><span class="ih-poem__line">None of this is the author's text;</span><span class="ih-poem__line">it shows the setting only.</span></p></article></body></html>
