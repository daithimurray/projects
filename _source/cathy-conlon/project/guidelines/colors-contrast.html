<!-- @dsCard group="Colors" viewport="700x300" subtitle="WCAG ratios computed live from the tokens" name="Contrast" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Contrast</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><table id="t"><tr><th>Pair</th><th>Sample</th><th>Light</th><th>Dark</th><th>Use</th></tr></table>
<script>
const pairs=[["--fg","--bg","Body text"],["--fg-secondary","--bg","Ledes"],["--fg-muted","--bg","Captions, meta"],["--fg-subtle","--bg","Large/decorative only"],["--accent","--bg","Accent text, eyebrows"],["--accent-fg","--accent","Accent button"],["--fg-inverse","--bg-inverse","Primary button, toast"],["--error-fg","--error-soft","Error alert"],["--success-fg","--success-soft","Success alert"]];
function lum(c){const m=c.match(/\d+(\.\d+)?/g).map(Number);const [r,g,b]=m.slice(0,3).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
function ratio(f,b){const a=lum(f),c=lum(b);return ((Math.max(a,c)+.05)/(Math.min(a,c)+.05)).toFixed(2)}
function probe(theme){const d=document.createElement("div");if(theme)d.dataset.theme=theme;document.body.appendChild(d);const get=(v)=>{const s=document.createElement("span");s.style.color="var("+v+")";d.appendChild(s);return getComputedStyle(s).color};const r=pairs.map(([f,b])=>ratio(get(f),get(b)));d.remove();return r}
const L=probe(),D=probe("dark");const t=document.getElementById("t");
pairs.forEach(([f,b,u],i)=>{const tr=document.createElement("tr");const ok=(v)=>v>=4.5?"var(--success)":v>=3?"var(--warning)":"var(--error)";tr.innerHTML='<td class="mono" style="color:var(--fg)">'+f+' / '+b+'</td><td><span style="display:inline-block;padding:2px 8px;background:var('+b+');color:var('+f+');font:500 12px var(--font-ui);border:1px solid var(--border)">Aa</span></td><td style="color:'+ok(L[i])+';font-weight:500">'+L[i]+'</td><td style="color:'+ok(D[i])+';font-weight:500">'+D[i]+'</td><td>'+u+'</td>';t.appendChild(tr)});
</script></body></html>
