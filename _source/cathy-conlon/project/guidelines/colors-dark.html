<!-- @dsCard group="Colors" viewport="700x260" subtitle="data-theme=dark or prefers-color-scheme; sienna lifts to #D08262" name="Dark mode, candlelight" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dark mode, candlelight</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div data-theme="dark" style="background:var(--bg);color:var(--fg);margin:-24px;padding:24px;min-height:260px">
   <div class="nm" style="margin-bottom:8px">Paper</div><div class="row"><div class="sw"><div class="chip" style="background:var(--paper-0)"></div><div class="nm">paper-0</div><div class="lbl">--paper-0</div></div><div class="sw"><div class="chip" style="background:var(--paper-1)"></div><div class="nm">paper-1</div><div class="lbl">--paper-1</div></div><div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="nm">paper-2</div><div class="lbl">--paper-2</div></div><div class="sw"><div class="chip" style="background:var(--paper-3)"></div><div class="nm">paper-3</div><div class="lbl">--paper-3</div></div></div>
   <div class="nm" style="margin:16px 0 8px">Ink & accent</div><div class="row"><div class="sw"><div class="chip" style="background:var(--ink-0)"></div><div class="nm">ink-0</div><div class="lbl">--ink-0</div></div><div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="nm">ink-2</div><div class="lbl">--ink-2</div></div><div class="sw"><div class="chip" style="background:var(--ink-4)"></div><div class="nm">ink-4</div><div class="lbl">--ink-4</div></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="nm">accent</div><div class="lbl">--accent</div></div><div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div class="nm">accent-soft</div><div class="lbl">--accent-soft</div></div><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="nm">success</div><div class="lbl">--success</div></div></div></div></body></html>
