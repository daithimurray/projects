<!-- @dsCard group="Colors" viewport="700x200" subtitle="Moss, ochre, madder, slate, equal lightness and chroma" name="Semantic hues" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Semantic hues</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="chip" style="background:var(--success-soft);margin-top:4px;height:40px;display:grid;place-items:center;color:var(--success-fg);font:500 12px var(--font-ui)">success on soft</div><div class="nm">success · moss</div><div class="lbl">--success / --success-soft / --success-fg</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="chip" style="background:var(--warning-soft);margin-top:4px;height:40px;display:grid;place-items:center;color:var(--warning-fg);font:500 12px var(--font-ui)">warning on soft</div><div class="nm">warning · ochre</div><div class="lbl">--warning / --warning-soft / --warning-fg</div></div><div class="sw"><div class="chip" style="background:var(--error)"></div><div class="chip" style="background:var(--error-soft);margin-top:4px;height:40px;display:grid;place-items:center;color:var(--error-fg);font:500 12px var(--font-ui)">error on soft</div><div class="nm">error · madder</div><div class="lbl">--error / --error-soft / --error-fg</div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div class="chip" style="background:var(--info-soft);margin-top:4px;height:40px;display:grid;place-items:center;color:var(--info-fg);font:500 12px var(--font-ui)">info on soft</div><div class="nm">info · slate</div><div class="lbl">--info / --info-soft / --info-fg</div></div></div></body></html>
