<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Three voices</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div class="row" style="align-items:flex-start">

   <div class="sw"><div style="font:400 56px/1 var(--font-text)">Aa</div><div class="nm" style="margin-top:8px">Newsreader</div><div class="lbl">--font-text · poems, prose, blurbs · 400–600</div></div>
   <div class="sw"><div style="font:500 56px/1 var(--font-ui)">Aa</div><div class="nm" style="margin-top:8px">Instrument Sans</div><div class="lbl">--font-ui · buttons, labels, nav, meta · 400–600</div></div>
   <div class="sw"><div style="font:400 56px/1 var(--font-mono)">Aa</div><div class="nm" style="margin-top:8px">JetBrains Mono</div><div class="lbl">--font-mono · code, tokens, kbd</div></div></div></body></html>
