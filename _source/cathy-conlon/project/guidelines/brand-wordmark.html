<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Wordmark</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div class="row" style="justify-content:space-between;align-items:center">
   <div><div style="font:500 40px/1 var(--font-display);letter-spacing:-.01em">Cathy Conlon</div><div class="lbl" style="margin-top:8px">Nav: 24px · 500 · Cormorant. Footer: 24px. Hero uses display level instead.</div></div>
   <div style="font:300 14px/1.5 var(--font-display);letter-spacing:.4em;color:var(--fg-subtle)">· · ·</div>
   <div><div style="font:400 13px/1.4 var(--font-ui);color:var(--fg-muted);letter-spacing:.12em;text-transform:uppercase">Irish writer · Celbridge</div><div class="lbl" style="margin-top:8px">Descriptor as overline, sienna in hero, muted elsewhere.</div></div></div></body></html>
