<!-- @dsCard group="Grid" viewport="700x190" subtitle="Gutter 16→24 fluid · margin 20→64 · max 1200" name="12 columns" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>12 columns</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div class="ih-grid" style="gap:var(--grid-gutter)"><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">1</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">2</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">3</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">4</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">5</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">6</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">7</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">8</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">9</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">10</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">11</div><div style="height:64px;background:var(--accent-soft);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--accent-soft-fg)">12</div></div>
  <div class="ih-grid" style="margin-top:12px"><div style="grid-column:span 7;height:28px;background:var(--bg-inset);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--fg-muted)">copy · span 7</div><div style="grid-column:9 / span 4;height:28px;background:var(--bg-inset);border-radius:2px;display:grid;place-items:center;font:11px var(--font-mono);color:var(--fg-muted)">media · 9 / span 4</div></div>
  <div class="lbl" style="margin-top:10px">Reading text ignores the grid and sits in --measure (38rem), centred or on columns 3–9.</div></body></html>
