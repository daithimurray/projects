<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Color usage</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div class="row" style="align-items:stretch">
   <div class="sw" style="padding:16px;border:1px solid var(--border);border-radius:8px"><div class="type-overline" style="color:var(--success);margin-bottom:8px">Do</div><div style="font:300 28px/1.05 var(--font-display)">The Light Dancing</div><p style="font:16px/1.5 var(--font-text);color:var(--fg-secondary);margin:8px 0 12px">Ink on paper. One warm accent on the action that matters.</p><span class="ih-btn ih-btn--accent ih-btn--sm">Buy the book</span> <span class="ih-btn ih-btn--tertiary ih-btn--sm">Read →</span></div>
   <div class="sw" style="padding:16px;border:1px solid var(--border);border-radius:8px"><div class="type-overline" style="color:var(--error);margin-bottom:8px">Don't</div><div style="font:600 28px/1.05 var(--font-display);color:var(--accent)">The Light Dancing</div><p style="font:16px/1.5 var(--font-text);color:var(--accent);margin:8px 0 12px">Sienna headlines, sienna body, two sienna buttons, nothing leads.</p><span class="ih-btn ih-btn--accent ih-btn--sm">Buy</span> <span class="ih-btn ih-btn--accent ih-btn--sm">Read</span></div></div></body></html>
