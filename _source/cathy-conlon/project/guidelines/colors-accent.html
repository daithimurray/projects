<!-- @dsCard group="Colors" viewport="700x130" subtitle="One accent: hover warmth, links, the single commercial CTA" name="Sienna accent" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sienna accent</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center} .sw{flex:1 1 0;min-width:0} .chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgb(var(--shadow-color)/.08)} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nm{font:500 12px/1.4 var(--font-ui);color:var(--fg)} table{border-collapse:collapse;width:100%;font:400 12px/1.4 var(--font-ui)} td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle} th{font-weight:500;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase} .mono{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)} </style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--sienna-100)"></div><div class="nm">100</div><div class="lbl">--sienna-100</div></div><div class="sw"><div class="chip" style="background:var(--sienna-300)"></div><div class="nm">300</div><div class="lbl">--sienna-300</div></div><div class="sw"><div class="chip" style="background:var(--sienna-400)"></div><div class="nm">400</div><div class="lbl">--sienna-400</div></div><div class="sw"><div class="chip" style="background:var(--sienna-500)"></div><div class="nm">500 · accent</div><div class="lbl">--sienna-500</div></div><div class="sw"><div class="chip" style="background:var(--sienna-600)"></div><div class="nm">600 · hover</div><div class="lbl">--sienna-600</div></div><div class="sw"><div class="chip" style="background:var(--sienna-700)"></div><div class="nm">700 · active</div><div class="lbl">--sienna-700</div></div></div></body></html>
