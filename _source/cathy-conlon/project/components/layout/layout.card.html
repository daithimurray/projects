IHLoad(paths).then(NS => { const { Button, TextLink, Figure, Container, Grid, Col, Section, Hero, NewsletterSignup } = NS; ReactDOM.createRoot(el).render(<App/>); function App(){ return (<div style={{margin:-24}}>

    <Grid>{[3,3,3,3].map((s,i)=><Col key={i} span={3}><div className="ih-book__placeholder" style={{position:"static",aspectRatio:"2/3",borderRadius:2,fontSize:14}}>Cover {i+1}</div></Col>)}</Grid>
  </Section>
  <div style={{padding:"0 24px 24px"}}><NewsletterSignup variant="inline"/></div>
</div>); } });
