<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Actions</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);color:var(--fg)} .g{display:grid;gap:20px} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center} .lbl{font:400 11px/1.4 var(--font-mono);color:var(--fg-muted);margin-bottom:8px} .blk{display:flex;flex-direction:column}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../guidelines/ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const el = document.getElementById("root");
const paths = ["../actions/Button.jsx","../actions/IconButton.jsx","../actions/TextLink.jsx","../actions/ButtonGroup.jsx"];
IHLoad(paths).then(NS => { const { Button, IconButton, TextLink, ButtonGroup } = NS; ReactDOM.createRoot(el).render(<App/>); function App(){ return (<div className="g">
  <div><div className="lbl">variants</div><div className="row"><Button>Primary</Button><Button variant="secondary">Secondary</Button><Button variant="tertiary">Tertiary</Button><Button variant="accent">Buy the book</Button><Button variant="danger">Delete</Button><Button variant="link">Link</Button></div></div>
  <div><div className="lbl">sizes · states</div><div className="row"><Button size="sm">Small</Button><Button>Medium</Button><Button size="lg">Large</Button><Button disabled>Disabled</Button><Button loading>Loading</Button><Button variant="secondary" iconEnd="→">With icon</Button></div></div>
  <div><div className="lbl">IconButton · TextLink · ButtonGroup</div><div className="row"><IconButton label="Close">×</IconButton><IconButton label="Menu" variant="outline">☰</IconButton><IconButton label="Saved" pressed round>♥</IconButton><IconButton label="Share" size="sm">↗</IconButton>
  <span style={{fontFamily:"var(--font-text)"}}>Read the <TextLink href="#">full poem</TextLink></span><TextLink href="#" variant="arrow">All readings</TextLink><TextLink href="#" external>Bookshop</TextLink>
  <ButtonGroup attached label="Sort"><Button variant="secondary" size="sm">Newest</Button><Button variant="secondary" size="sm">A–Z</Button><Button variant="secondary" size="sm">Collection</Button></ButtonGroup></div></div>
</div>); } });
</script></body></html>
