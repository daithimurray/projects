<!-- @startingPoint section="Website" subtitle="Cathy Conlon single-page site with anchor navigation" viewport="1280x800" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cathy Conlon, Writer</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../guidelines/ds-loader.js"></script>
<style>@media (max-width: 64em){ .ih-grid > [style*="span 3"]{grid-column:span 6 !important} .ih-grid > [style*="span 4"]{grid-column:span 6 !important} .ih-grid > [style*="span 8"].ih-grid > [style*="span 7"]{grid-column:span 12 !important} .ih-grid > [style*="9 / span 4"]{grid-column:span 12 !important} .ih-grid > [style*="3 / span 8"]{grid-column:span 12 !important} }
@media (max-width: 40em){ .ih-grid > [style*="span 6"]{grid-column:span 12 !important} .ih-grid > [style*="span 3"]{grid-column:span 6 !important} }</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const comps = ["actions/Button","actions/IconButton","actions/TextLink","actions/ButtonGroup","forms/TextField","forms/TextArea","forms/Select","forms/Checkbox","forms/Radio","forms/Switch","forms/SearchField","navigation/NavBar","navigation/Footer","navigation/Breadcrumb","navigation/Tabs","navigation/Pagination","navigation/SkipLink","content/PoemBlock","content/PullQuote","content/BookCard","content/EventCard","content/PostCard","content/Byline","content/Divider","content/Figure","feedback/Alert","feedback/Toast","feedback/Badge","feedback/Tag","feedback/Tooltip","feedback/Skeleton","feedback/EmptyState","overlays/Dialog","overlays/Drawer","overlays/Menu","layout/Container","layout/Section","layout/Hero","layout/NewsletterSignup"].map(p => "../../components/" + p + ".jsx");
const screens = ["data.js"].concat(["OnePage"].map(s => s + ".jsx")).map(s => "./" + s);
IHLoad(comps).then(NS => IHLoad(screens).then(() => {
  const { SkipLink, NavBar, Footer, Switch, Toast, ToastRegion, Drawer, OnePage } = window.IH;
  const links = [{ label: "Books", href: "#books" }, { label: "Swift & Vanessa", href: "#swift" }, { label: "Poetry", href: "#poetry" }, { label: "Events", href: "#events" }, { label: "About", href: "#about" }, { label: "Contact", href: "#contact" }];
  function App() {
    const [dark, setDark] = React.useState(() => localStorage.getItem("ih-kit-theme") === "dark");
    const [toast, setToast] = React.useState(null);
    const [current, setCurrent] = React.useState("#top");
    React.useEffect(() => { document.documentElement.dataset.theme = dark ? "dark" : "light"; localStorage.setItem("ih-kit-theme", dark ? "dark" : "light"); }, [dark]);
    React.useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 4000); return () => clearTimeout(t); }, [toast]);
    React.useEffect(() => {
      const ids = links.map(l => l.href.slice(1));
      const obs = new IntersectionObserver((es) => { es.forEach(x => { if (x.isIntersecting) setCurrent("#" + x.target.id); }); }, { rootMargin: "-40% 0px -55% 0px" });
      ids.forEach(id => { const el = document.getElementById(id); el && obs.observe(el); });
      return () => obs.disconnect();
    }, []);
    const nav = (e) => { const a = e.target.closest && e.target.closest("a[href]"); if (!a) return; const h = a.getAttribute("href"); if (h && h.startsWith("#") && h.length > 1) { const el = document.getElementById(h.slice(1)); if (el) { e.preventDefault(); const top = el.getBoundingClientRect().top + window.scrollY - 72; window.scrollTo({ top, behavior: "smooth" }); history.replaceState(null, "", h); } } else if (h === "#") e.preventDefault(); };
    return <div onClick={nav}>
      <SkipLink />
      <NavBar brand="Cathy Conlon" brandHref="#top" current={current} links={links} actions={<><Switch id="theme" size="sm" label={<span className="type-caption text-muted">Candlelight</span>} checked={dark} onChange={setDark} /></>} />
      <main id="main" tabIndex={-1}><OnePage onToast={setToast} /></main>
      <Footer name="Cathy Conlon" tagline="Poetry, fiction and radio drama from Celbridge, Co. Kildare." columns={[{ title: "On this page", links: [{ label: "Books", href: "#books" }, { label: "Poetry", href: "#poetry" }, { label: "Swift & Vanessa", href: "#swift" }] }, { title: "Meet", links: [{ label: "Events", href: "#events" }, { label: "About", href: "#about" }, { label: "Contact", href: "#contact" }] }, { title: "Elsewhere", links: [{ label: "X · @cat_conlon", href: "https://x.com/cat_conlon" }, { label: "Buythebook.ie", href: "https://www.buythebook.ie/product/swift-vanessa-the-sluttery/" }, { label: "Limerick Writers' Centre", href: "https://limerickwriterscentre.com/" }] }]} bottomLinks={[{ label: "Privacy", href: "#" }, { label: "Colophon", href: "#" }]} />
      {toast && <ToastRegion><Toast tone="success" message={toast} onDismiss={() => setToast(null)} /></ToastRegion>}
    </div>;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}));
</script></body></html>
