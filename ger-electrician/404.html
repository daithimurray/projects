<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0efea" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Ger, Electrician — North Kildare</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23b8271c'/%3E%3Cg fill='none' stroke='%23f0efea' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M4 21h4M24 21h4'/%3E%3Cpath d='M8 21 20 12'/%3E%3C/g%3E%3Cg fill='%23f0efea'%3E%3Ccircle cx='8' cy='21' r='2.4'/%3E%3Ccircle cx='24' cy='21' r='2.4'/%3E%3C/g%3E%3C/svg%3E"
      type="image/svg+xml"
    />

    <!-- Deliberately self-contained. A 404 can be served from any path, so
         this page links to nothing relative and loads no external asset —
         it must work even when the URL depth is wrong.

         Placeholder telephone: 087 000 0000 / +353870000000. -->

    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1.5rem;
        padding: 2rem clamp(1.25rem, 5vw, 4rem);
        background: #f0efea;
        color: #12181c;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.65;
      }
      .ref {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #545d63;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .ref::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgb(18 24 28 / 0.16);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 1.5rem + 2.4vw, 3rem);
        font-weight: 700;
        line-height: 1.06;
        letter-spacing: -0.03em;
        max-width: 16ch;
      }
      p {
        margin: 0;
        max-width: 44ch;
        color: #545d63;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0.5rem 1.4rem;
        border: 1px solid transparent;
        border-radius: 2px;
        font-weight: 600;
        text-decoration: none;
      }
      .call {
        background: #b8271c;
        color: #fff;
      }
      .call:hover {
        background: #9c1e15;
      }
      .home {
        color: #12181c;
        border-color: rgb(18 24 28 / 0.38);
      }
      .home:hover {
        background: #e5e3dc;
        border-color: #12181c;
      }
      a:focus-visible {
        outline: 3px solid #b8271c;
        outline-offset: 2px;
      }
      .tel {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 1.5rem;
        font-weight: 500;
        color: #12181c;
        text-decoration: none;
        border-bottom: 2px solid rgb(18 24 28 / 0.16);
      }
      .tel:hover {
        color: #b8271c;
        border-bottom-color: #b8271c;
      }
    </style>
  </head>

  <body>
    <p class="ref">Error 404</p>
    <h1>That page is not here</h1>
    <p>
      The link may be out of date. Ger is still very much reachable on the
      number below.
    </p>
    <p><a class="tel" href="tel:+353870000000">087 000 0000</a></p>
    <div class="actions">
      <a class="btn call" href="tel:+353870000000">Call Ger</a>
      <a class="btn home" href="/">Back to the homepage</a>
    </div>
  </body>
</html>
